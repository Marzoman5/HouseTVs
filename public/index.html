<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b0d10" />
<title>HomeTV Remote</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#15191f; --panel2:#1c222b; --edge:#2a323d;
    --txt:#e8edf3; --muted:#8a94a3; --accent:#3b82f6; --accent2:#2563eb;
    --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{max-width:430px;margin:0 auto;padding:14px 14px 40px;min-height:100vh}
  h1{font-size:15px;font-weight:600;letter-spacing:.3px;margin:4px 2px 12px;color:var(--muted)}
  .bar{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--edge);border-radius:12px;padding:10px 12px;margin-bottom:14px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:0 0 auto;
    box-shadow:0 0 0 0 rgba(0,0,0,0)}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.bad{background:var(--bad)}
  .dot.warn{background:var(--warn)}
  .bar .st{font-size:13px;flex:1 1 auto;color:var(--muted)}
  .bar button{font-size:12px;padding:7px 10px;border-radius:9px}
  .grid{display:grid;gap:10px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  button{appearance:none;border:1px solid var(--edge);background:var(--panel2);color:var(--txt);
    font-size:16px;font-weight:600;padding:16px 0;border-radius:14px;cursor:pointer;
    transition:transform .04s,background .12s;user-select:none;touch-action:manipulation}
  button:active{transform:scale(.94);background:#283140}
  button.sm{font-size:13px;padding:12px 0}
  button.accent{background:var(--accent2);border-color:var(--accent)}
  button.power{background:#3a1416;border-color:#5b1d20;color:#ff9ea2}
  button.wide{grid-column:span 2}
  section{background:var(--panel);border:1px solid var(--edge);border-radius:16px;
    padding:14px;margin-bottom:14px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 2px 10px}
  /* D-pad */
  .dpad{position:relative;width:230px;height:230px;margin:2px auto 0}
  .dpad button{position:absolute;width:74px;height:74px;padding:0;font-size:20px}
  .up{top:0;left:78px}.down{bottom:0;left:78px}.left{left:0;top:78px}.right{right:0;top:78px}
  .ok{top:78px;left:78px;background:var(--accent2);border-color:var(--accent);border-radius:50%}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  input[type=text]{flex:3;background:var(--panel2);border:1px solid var(--edge);color:var(--txt);
    border-radius:12px;padding:0 12px;font-size:15px}
  .hint{font-size:12px;color:var(--muted);margin:10px 2px 0;line-height:1.5}
  a{color:var(--accent)}
</style>
</head>
<body>
  <h1>HOMETV REMOTE · UN58MU6070</h1>

  <div class="bar">
    <div class="dot" id="dot"></div>
    <div class="st" id="st">checking…</div>
    <button class="sm" id="pairBtn" onclick="pair()">Pair</button>
  </div>

  <section>
    <div class="grid g4">
      <button class="power" onclick="k('KEY_POWER')">⏻</button>
      <button class="sm" onclick="powerOn()">Wake</button>
      <button class="sm" onclick="k('KEY_SOURCE')">Source</button>
      <button class="sm" onclick="k('KEY_HOME')">Home</button>
    </div>
  </section>

  <section>
    <div class="lbl">Navigate</div>
    <div class="dpad">
      <button class="up" onclick="k('KEY_UP')">▲</button>
      <button class="left" onclick="k('KEY_LEFT')">◀</button>
      <button class="ok" onclick="k('KEY_ENTER')">OK</button>
      <button class="right" onclick="k('KEY_RIGHT')">▶</button>
      <button class="down" onclick="k('KEY_DOWN')">▼</button>
    </div>
    <div class="grid g3" style="margin-top:12px">
      <button class="sm" onclick="k('KEY_RETURN')">↩ Back</button>
      <button class="sm" onclick="k('KEY_MENU')">☰ Menu</button>
      <button class="sm" onclick="k('KEY_EXIT')">✕ Exit</button>
    </div>
  </section>

  <section>
    <div class="lbl">Volume <span id="volReadout" style="float:right;color:var(--txt);font-weight:700">–</span></div>
    <input type="range" id="volSlider" min="0" max="100" value="0"
           oninput="$('volReadout').textContent=this.value" onchange="setVol(this.value)"
           style="width:100%;accent-color:var(--accent)" />
    <div class="grid g3" style="margin-top:12px">
      <button onclick="volDown()">Vol −</button>
      <button id="muteBtn" onclick="toggleMute()">🔇 Mute</button>
      <button onclick="volUp()">Vol +</button>
    </div>
    <div class="hint" style="margin-top:8px">Reliable UPnP channel (bypasses the flaky remote-key path).</div>
  </section>

  <section>
    <div class="lbl">Channel <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">· TV tuner source only</span></div>
    <div class="grid g3">
      <button onclick="k('KEY_CHDOWN')">CH −</button>
      <button class="sm" onclick="k('KEY_CH_LIST')">CH List</button>
      <button onclick="k('KEY_CHUP')">CH +</button>
    </div>
  </section>

  <section>
    <div class="lbl">Media</div>
    <div class="grid g4">
      <button class="sm" onclick="k('KEY_REWIND')">⏪</button>
      <button class="sm" onclick="k('KEY_PLAY')">▶</button>
      <button class="sm" onclick="k('KEY_PAUSE')">⏸</button>
      <button class="sm" onclick="k('KEY_FF')">⏩</button>
    </div>
  </section>

  <section>
    <div class="lbl">Numbers</div>
    <div class="grid g3">
      <button class="sm" onclick="k('KEY_1')">1</button>
      <button class="sm" onclick="k('KEY_2')">2</button>
      <button class="sm" onclick="k('KEY_3')">3</button>
      <button class="sm" onclick="k('KEY_4')">4</button>
      <button class="sm" onclick="k('KEY_5')">5</button>
      <button class="sm" onclick="k('KEY_6')">6</button>
      <button class="sm" onclick="k('KEY_7')">7</button>
      <button class="sm" onclick="k('KEY_8')">8</button>
      <button class="sm" onclick="k('KEY_9')">9</button>
      <button class="sm" onclick="k('KEY_0')" style="grid-column:2">0</button>
    </div>
  </section>

  <section>
    <div class="lbl">Type into TV (search boxes)</div>
    <div class="row">
      <input type="text" id="txt" placeholder="text…" />
      <button class="accent sm" onclick="sendText()">Send</button>
    </div>
  </section>

  <div class="hint" id="hint"></div>

<script>
const $ = (id) => document.getElementById(id);
async function api(path, body){
  const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
    body: body?JSON.stringify(body):undefined});
  return r.json().catch(()=>({}));
}
async function k(key){
  if(navigator.vibrate) navigator.vibrate(8);
  const r = await api('/api/key',{key});
  if(!r.ok && r.error) flash(r.error);
}
async function volUp(){ showVol(await api('/api/vol/up')); }
async function volDown(){ showVol(await api('/api/vol/down')); }
async function setVol(v){ showVol(await api('/api/volume',{volume:Number(v)})); }
async function toggleMute(){ await api('/api/mute'); pollVol(); }
function showVol(r){ if(r && r.volume!=null){ $('volReadout').textContent=r.volume; $('volSlider').value=r.volume; } }
async function pollVol(){
  try{
    const v = await (await fetch('/api/volume')).json();
    if(v.volume!=null){ $('volSlider').value=v.volume; $('volReadout').textContent = v.mute ? 'muted' : v.volume; }
    const mb=$('muteBtn'); if(mb) mb.textContent = v.mute ? '🔈 Unmute' : '🔇 Mute';
  }catch(e){}
}
async function pair(){ const r=await api('/api/pair'); flash(r.message||'pairing…'); }
async function powerOn(){ const r=await api('/api/power-on'); flash(r.message||''); }
async function sendText(){
  const t=$('txt').value; if(!t) return;
  const r=await api('/api/text',{text:t});
  flash(r.ok?'sent':'send failed');
}
function flash(msg){ $('hint').textContent = msg; }
async function poll(){
  try{
    const s = await (await fetch('/api/status')).json();
    const dot=$('dot'), st=$('st');
    if(s.connected){ dot.className='dot ok'; st.textContent='Connected to '+s.tvIp; $('pairBtn').style.display='none'; }
    else if(s.connecting){ dot.className='dot warn'; st.textContent='Connecting…'; }
    else if(s.hasToken){ dot.className='dot warn'; st.textContent='Paired, reconnecting…'; }
    else { dot.className='dot bad'; st.textContent='Not paired'; $('pairBtn').style.display=''; }
    if(s.lastError && !s.connected) flash(s.lastError);
  }catch(e){ $('dot').className='dot bad'; $('st').textContent='Server unreachable'; }
}
setInterval(poll, 1500); poll();
setInterval(pollVol, 2500); pollVol();
</script>
</body>
</html>
